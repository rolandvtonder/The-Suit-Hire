# Builds the site and publishes it into the repository root.
#
# WHY THE ROOT AND NOT A PAGES ARTIFACT
#
# This repository's Pages source is "Deploy from a branch", so every push also
# triggers GitHub's own legacy pages-build-deployment, which republishes the
# repository root as-is. Both fire within a couple of seconds of each other and
# the legacy build wins, so an upload-pages-artifact deploy was being silently
# overwritten — the site kept serving src/main.tsx, which no browser can run.
#
# Rather than fight it, this workflow writes the built site into the root, which
# is exactly what the legacy builder then publishes.
#
# TO SIMPLIFY THIS LATER
#
# Set Settings -> Pages -> Build and deployment -> Source to "GitHub Actions".
# Then the copy-and-commit job below can be replaced with upload-pages-artifact
# + deploy-pages, and the build output can come out of the repository again.

name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two publishes at once — a cancelled one can leave the root
# half-updated, and half a site is worse than a stale one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins, so a deploy cannot quietly pick up a new
      # dependency version that was never tested locally.
      - run: npm ci

      # The checkout still carries the previous deploy's bundle. Clear it before
      # building so old hashed filenames do not pile up in the tree, and so
      # nothing in the build reads last deploy's output as input.
      - name: Clear the previous publish
        run: rm -rf assets

      # Runs make-pages, then tsc, then vite build — so a type error fails the
      # deploy instead of publishing a broken page.
      - run: npm run build

      - name: Copy the build into the repository root
        run: |
          set -euo pipefail
          # The trailing /. copies the contents rather than the folder itself.
          cp -a dist/. .
          rm -rf dist

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Build output unchanged — nothing to publish.'
            exit 0
          fi
          # [skip ci] stops this workflow re-triggering itself. GitHub's own
          # pages build is not an Actions workflow, so it still runs on this
          # push — which is the point: that is what publishes the site.
          git commit -m "Publish build for ${GITHUB_SHA::7} [skip ci]"
          git push
