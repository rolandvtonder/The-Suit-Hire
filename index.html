<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141311" />

    <title>The Suit Hire — Tuxedo &amp; Suit Rentals, Johannesburg South</title>
    <meta
      name="description"
      content="Tuxedo and suit hire for weddings, matric dances and formal occasions. Fitted in person by David in Suideroord, Johannesburg South. 5.0 from 85 Google reviews."
    />
    <!-- TODO: replace with the real domain once it is registered. -->
    <link rel="canonical" href="https://thesuithire.co.za/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="business.business" />
    <meta property="og:title" content="The Suit Hire — Tuxedo &amp; Suit Rentals, Johannesburg South" />
    <meta
      property="og:description"
      content="Hired for one day. Remembered for life. Suits and tuxedos fitted in person by David in Suideroord."
    />
    <meta property="og:image" content="/photos/hero-party.jpg" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/photos/hero-party.jpg" />

    <!--
      Local-business structured data. This is what lets Google show the star
      rating, hours and phone number directly in search results, so it has to
      stay in step with the real Google Business Profile listing.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "The Suit Hire",
        "description": "Tuxedo and suit rentals for weddings, matric dances and formal occasions in Johannesburg South.",
        "image": "/logo.png",
        "telephone": "+27838520155",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "9 Cilliers Street",
          "addressLocality": "Suideroord, Johannesburg South",
          "postalCode": "2091",
          "addressRegion": "Gauteng",
          "addressCountry": "ZA"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "reviewCount": "85"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "17:30"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "14:00"
          }
        ],
        "sameAs": [
          "https://www.facebook.com/thesuithire/",
          "https://www.instagram.com/thesuithiresa/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
